
[project]
name = "snaparc"
version = "0.0.1"
description = "SnapArc: free Windows desktop productivity tools with optional AI workflows and configurable plugins."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "customtkinter",
    "keyboard",
    "numpy",
    "httpx>=0.28,<1",
    "pillow",
    "pyautogui",
    "pygments",
    "pyperclip",
    "pywebview",
    "python-dotenv",
    "requests",
    "soundcard",
    "soundfile",
    "pypdf>=6.14.2",
    "tomli>=1; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["plugins*", "tests*", "data*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false