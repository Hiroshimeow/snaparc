name: CI (offline, Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  safety-and-tests:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (tracked Git history)
        shell: pwsh
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.18.4 detect --source . --redact --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Locked environment using CPython with Tcl/Tk
        shell: pwsh
        run: |
          $python = python -c "import sys, tkinter; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv sync --locked --python $python --group dev
      - name: Release asset audit
        shell: pwsh
        run: uv run --locked python scripts/release_asset_audit.py
      - name: Source license audit
        shell: pwsh
        run: uv run --locked python scripts/release_license_audit.py
      - name: Release brand audit
        shell: pwsh
        run: uv run --locked python scripts/release_brand_audit.py
      - name: OpenAI-compatible protocol audit
        shell: pwsh
        run: uv run --locked python scripts/release_protocol_audit.py
      - name: Markdown URL injection regression
        shell: pwsh
        run: node scripts/test_markdown_url_security.cjs
      - name: Windows source smoke
        shell: pwsh
        run: uv run --locked python -m src.release_smoke
      - name: Offline tests
        shell: pwsh
        run: uv run --locked python -m pytest -q tests
      - name: Source package build
        shell: pwsh
        run: uv build --offline --no-build-isolation
