privacy:
  allow_cloud_upload: false

models:
  providers:
    my-provider:
      api: openai-completions
      baseUrl: https://example.invalid/v1
      apiKey: ""
      models:
        - example-model
      supportsImages: true
      supportsAudio: false

agents:
  defaults:
    model:
      primary: my-provider/example-model
    prompt_type: prompt_translate

hotkeys:
  - id: TransToVietnamese
    prompt_type: prompt_translate
    keys: ctrl + shift + alt + v
    system_prompt: Translate to Vietnamese
  - id: TransToJapanese
    prompt_type: prompt_translate
    keys: ctrl + shift + alt + j
    system_prompt: Translate to Japanese
  - id: TransToEnglish
    prompt_type: prompt_translate
    keys: ctrl + shift + alt + e
    system_prompt: Translate to English
  - id: SummarizeContent
    prompt_type: prompt_summarize
    keys: ctrl + shift + alt + s
  - id: FixPrompt
    prompt_type: prompt_fix_grammar
    keys: ctrl + shift + alt + f
  - id: AnalyzeExpert
    prompt_type: prompt_expert
    keys: ctrl + shift + alt + a

screenshot_chat:
  enabled: true
  default_model: my-provider/example-model
  pi_primary_mode: true

audio:
  stt:
    preferred_model: ""
    audio_capable_models: []

radial_plugins:
  allow_user_plugins: false
